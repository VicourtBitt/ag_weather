<div class="container">
  <input type="text" [(ngModel)]="city" placeholder="Digite uma cidade" />
  <button (click)="searchWeather()">🔍 Buscar</button>

  <app-weather-card [weather]="weather" [onFavorite]="favoriteCity"></app-weather-card>
  
  <app-favorites-sidebar [favorites]="favorites" (citySelected)="searchWeather($event)"></app-favorites-sidebar>
</div>
